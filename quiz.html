<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Quiz</title>
    <link rel="stylesheet" href="css/quiz.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="outer-circle">
          <div class="inner-circle">
            <span id="time">00:00</span>
          </div>
        </div>
        <p>setting</p>
      </header>

      <section>
        <div class="text">
          <div>
            Welcome to the
            <p>Frontend Quiz!</p>
          </div>
          <p>Pick a subject to get started.</p>
        </div>

        <!--  -->

        <div class="categories">
          <div id="html">
            <span
              ><i style="color: #e34c26" class="fa-solid fa-code fa-fade"></i
            ></span>
            <h2>HTML</h2>
          </div>
          <div id="css">
            <span
              ><i style="color: #264de4" class="fa-brands fa-css3 fa-fade"></i
            ></span>
            <h2>CSS</h2>
          </div>
          <div id="js">
            <span
              ><i style="color: #f7df1e" class="fa-brands fa-js fa-fade"></i
            ></span>
            <h2>JavaScript</h2>
          </div>
          <div id="react">
            <span
              ><i style="color: #61dafb" class="fa-brands fa-react fa-fade"></i
            ></span>
            <h2>React</h2>
          </div>
        </div>
      </section>
    </div>
    <script src="js/startExam.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/timer.js"></script>
  </body>
</html>
